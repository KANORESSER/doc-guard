<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Media Base API</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Media Base API</h1>
    <p>通常の公開ページです。</p>

    <hr>

    <h2>極秘資料を見る</h2>

    <button id="generateBtn">OTP発行</button>

    <div id="otpModal" class="modal hidden">
        <div class="modal-content">
            <h3>ワンタイムパスワード</h3>
            <p id="modalOtpText"></p>
            <button id="closeModalBtn">閉じる</button>
        </div>
    </div>

    <input name="otpInput" type="text" id="otpInput" placeholder="OTPを入力してください">
    <button type="submit" id="verifyBtn">認証</button>

    <p id="message"></p>

    <script src="/static/script.js"></script>
</body>
</html>
